name: Update profile cards

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["profile/**"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Shared neon theme: navy -> purple gradient, cyan titles, pink icons
      THEME: bg_color=135,060a14,0c1430,1a0f3a&title_color=22d3ee&text_color=c9d1d9&icon_color=f472b6&ring_color=22d3ee&border_color=2a3550&border_radius=14
    steps:
      - uses: actions/checkout@v7

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&include_all_commits=true&line_height=28&custom_title=David%27s%20GitHub%20Stats&${{ env.THEME }}
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=donut&langs_count=6&size_weight=0.5&count_weight=0.5&custom_title=Top%20Languages&${{ env.THEME }}
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#0e4f5c,#0f7c8c,#14b8c8,#22d3ee
            profile/snake-light.svg?palette=github-light&color_snake=#db2777&color_dots=#ebedf0,#c7f2fa,#7fdcef,#22b8d6,#0e7490

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile cards" || exit 0
          git push
